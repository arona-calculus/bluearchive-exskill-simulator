[project]
name = "bluearchive-exskill-simulator"
version = "0.1.0"
description = "Timeline Simulator for Blue Archive: An algebraic engine for EX skill sequences."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
webui = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py313"]

[dependency-groups]
# ワークスペース内での開発用
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
]
