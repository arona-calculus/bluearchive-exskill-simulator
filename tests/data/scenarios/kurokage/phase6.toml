title = "黒影 フェーズ6: キキョウ アル リオ→ハナコ キサキ…"
description = """
黒影(d33)の実戦TLの再現(Step 41-48)。
リオがコピー → キサキでゲージを積む → コピーが代理実行(ハナコが手札にいるため即ドローは不発) →
ハナコが3連続で使われ、ゲージ切れでサイクル。
終了時: hanako_gauge=0、ハナコは山札の末尾。
"""
cards = ["Kikyou", "Aru", "Sena", "Kisaki", "Rio", "Hanako_Swimsuit"]
env = { hanako_gauge = 80 }

[[steps]]
slot = 0
card = "Kikyou"
note = "Step 41: ゲージ120"
expect = { env = { hanako_gauge = 120 } }

[[steps]]
slot = 1
card = "Aru"
note = "Step 42: ゲージ160"
expect = { env = { hanako_gauge = 160 } }

[[steps]]
slot = 1
card = "Rio"
target = "Hanako_Swimsuit"
note = "Step 43: リオ → Rio_Copy、ゲージ200(上限)"
expect = { cards = ["Kisaki", "Rio_Copy", "Sena", "Hanako_Swimsuit", "Kikyou", "Aru"], env = { hanako_gauge = 200 } }

[[steps]]
slot = 0
card = "Kisaki"
note = "Step 44: ゲージ200を維持(上限)"
expect = { cards = ["Hanako_Swimsuit", "Rio_Copy", "Sena", "Kikyou", "Aru", "Kisaki"], env = { hanako_gauge = 200 } }

[[steps]]
slot = 1
card = "Rio_Copy"
note = "Step 45: ハナコが手札にいるため即ドロー不発、ゲージ200を維持"
expect = { cards = ["Hanako_Swimsuit", "Kikyou", "Sena", "Aru", "Kisaki", "Rio"], env = { hanako_gauge = 200 } }

[[steps]]
slot = 0
card = "Hanako_Swimsuit"
note = "Step 46: 1連目、ゲージ100消費して手札に留まる"
expect = { cards = ["Hanako_Swimsuit", "Kikyou", "Sena", "Aru", "Kisaki", "Rio"], env = { hanako_gauge = 100 } }

[[steps]]
slot = 0
card = "Hanako_Swimsuit"
note = "Step 47: 2連目、ゲージ100消費して手札に留まる"
expect = { cards = ["Hanako_Swimsuit", "Kikyou", "Sena", "Aru", "Kisaki", "Rio"], env = { hanako_gauge = 0 } }

[[steps]]
slot = 0
card = "Hanako_Swimsuit"
note = "Step 48: 3連目、ゲージ切れで通常サイクル"
expect = { cards = ["Aru", "Kikyou", "Sena", "Kisaki", "Rio", "Hanako_Swimsuit"], env = { hanako_gauge = 0 } }
